<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpiceBite</title>

<!-- Plausible -->

<script defer data-domain="yourdomain.com" src="https://plausible.io/js/script.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #121212;
  color: #fff;
}

header {
  background: #1f1f1f;
  padding: 15px;
  text-align: center;
  font-size: 24px;
  color: #ff9800;
}

.tabs {
  display: flex;
  justify-content: center;
  margin: 10px 0;
}

.tabs button {
  background: #1f1f1f;
  border: none;
  color: white;
  padding: 10px 15px;
  cursor: pointer;
}

.tabs button.active {
  background: #ff9800;
}

.container {
  padding: 20px;
}

.grid {
  display: none;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.grid.active {
  display: grid;
}

.card {
  background: #1e1e1e;
  border-radius: 10px;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.card-content {
  padding: 10px;
  text-align: center;
}

.price {
  color: #4caf50;
}

button {
  background: #ff9800;
  border: none;
  padding: 8px 12px;
  margin-top: 5px;
  cursor: pointer;
  color: black;
  border-radius: 5px;
}

.cart {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #1f1f1f;
  padding: 15px;
  text-align: center;
  border-top: 2px solid #ff9800;
}

</style>

</head>

<body>

<header>🍽️ SpiceBite</header>

<div class="tabs">
  <button class="active" onclick="showTab('starters')">Starters</button>
  <button onclick="showTab('main')">Main</button>
  <button onclick="showTab('dessert')">Desserts</button>
</div>

<div class="container">

  <!-- Starters -->

  <div id="starters" class="grid active">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1604908812337-19b1c7d9b3a4">
      <div class="card-content">
        <h3>French Fries</h3>
        <p class="price">₹99</p>
        <button onclick="addToCart(99)">Add</button>
      </div>
    </div>

    <p class="price">₹129</p>
    <button onclick="addToCart(129)">Add</button>

</div>

      <div class="card-content">
        <h3>Paneer Butter Masala</h3>

</div>

      <img src="https://images.unsplash.com/photo-1589307004398-ec9e0e7f8c1d">
      <div class="card-content">
        <h3>Chocolate Cake</h3>
        <p class="price">₹149</p>

</div>

<div class="cart">
  Total: ₹<span id="total">0</span>
  <br><br>
  <button onclick="checkout()">Checkout</button>
</div>

<script>
let total = 0;

function showTab(tab) {
  document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));
  document.getElementById(tab).classList.add('active');

  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function addToCart(price) {
  total += price;
  document.getElementById('total').innerText = total;

  if (window.plausible) {
    plausible('Add to Cart', { revenue: price });
  }
}

function checkout() {
  alert("Order placed!");

  if (window.plausible) {
    plausible('Checkout', { revenue: total });
  }

  total = 0;
  document.getElementById('total').innerText = total;
}
</script>

</body>
</html>
